services:
  db:
    image: postgres:16
    container_name: schola-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: schola
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: schola-api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # Override DB_HOST to point to the docker service name
      DB_HOST: db

volumes:
  pgdata:
